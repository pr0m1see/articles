<a class="resource-card" href="{{url}}">
  <div class="card-header">
    <span class="card-type"><img src="./assets/article-icon.svg" width="16" height="16" alt="">Article</span>
    <time class="card-meta" datetime="{{created_at}}">{{date}}</time>
  </div>
  <div class="card-content">
    <div class="card-copy">
      <h2>{{title}}</h2>
      <p>{{description}}</p>
      <span class="card-label">阅读全文 <span aria-hidden="true">→</span></span>
    </div>
    <img class="card-illustration" src="{{cover}}" alt="" loading="lazy">
  </div>
</a>
